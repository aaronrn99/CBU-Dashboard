<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="5" fill="#0e0e0e"/>

  <!-- Left wing -->
  <rect x="3" y="18" width="7" height="10" fill="none" stroke="#3dba72" stroke-width="1"/>
  <!-- Left wing window -->
  <rect x="5" y="21" width="3" height="2.5" fill="#3dba72" opacity="0.7"/>

  <!-- Center tower -->
  <rect x="11" y="7" width="10" height="21" fill="none" stroke="#3dba72" stroke-width="1.25"/>
  <!-- Center tower cap -->
  <rect x="11" y="4" width="10" height="3" fill="#3dba72" rx="1"/>
  <!-- Center tower windows — 2 cols × 3 rows -->
  <rect x="13"   y="10" width="3" height="2.5" fill="#3dba72" opacity="0.75"/>
  <rect x="17"   y="10" width="3" height="2.5" fill="#3dba72" opacity="0.75"/>
  <rect x="13"   y="14.5" width="3" height="2.5" fill="#3dba72" opacity="0.75"/>
  <rect x="17"   y="14.5" width="3" height="2.5" fill="#3dba72" opacity="0.75"/>
  <rect x="13"   y="19" width="3" height="2.5" fill="#3dba72" opacity="0.75"/>
  <rect x="17"   y="19" width="3" height="2.5" fill="#3dba72" opacity="0.75"/>

  <!-- Right wing -->
  <rect x="22" y="14" width="7" height="14" fill="none" stroke="#3dba72" stroke-width="1"/>
  <!-- Right wing windows -->
  <rect x="24" y="16.5" width="3" height="2.5" fill="#3dba72" opacity="0.7"/>
  <rect x="24" y="21"   width="3" height="2.5" fill="#3dba72" opacity="0.7"/>

  <!-- Ground line -->
  <line x1="1" y1="28" x2="31" y2="28" stroke="#3dba72" stroke-width="1.25"/>
</svg>
